<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>مِسبار | MISBAR</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Playfair+Display:wght@500;600&display=swap');
:root{font-family:Arial,sans-serif;color:#111;background:#fafafa}*{box-sizing:border-box}body{margin:0}header{border-bottom:1px solid #111;padding:22px 6vw;background:#fff}.nav{max-width:1120px;margin:auto;display:flex;align-items:center;justify-content:space-between}.brand{text-align:center;color:#000;text-decoration:none;line-height:1}.brand-ar{font-family:Amiri,serif;font-size:28px;font-weight:700}.brand-en{font-family:'Playfair Display',serif;font-size:12px;letter-spacing:3px;direction:ltr;margin-top:5px}.lang{border:1px solid #111;background:#fff;border-radius:999px;padding:8px 14px;cursor:pointer}main{max-width:1120px;margin:auto;padding:64px 6vw 90px}.hero{display:grid;grid-template-columns:1.4fr .8fr;gap:48px;align-items:center}h1{font-family:Amiri,serif;font-size:clamp(44px,7vw,78px);line-height:1.05;margin:0 0 18px}.hero p{font-size:18px;line-height:1.8;color:#555;max-width:620px}.mark{border:1px solid #111;border-radius:50%;width:230px;height:230px;display:grid;place-items:center;margin:auto;text-align:center}.mark strong{font-family:Amiri,serif;font-size:48px}.mark small{display:block;font-family:'Playfair Display',serif;letter-spacing:4px;margin-top:8px}.tools{display:grid;grid-template-columns:1fr 220px;gap:12px;margin:42px 0 14px}input,select{padding:14px 16px;border:1px solid #bbb;border-radius:10px;background:#fff}.count{color:#666;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}.card{background:#fff;border:1px solid #ddd;border-radius:14px;padding:22px;display:flex;flex-direction:column;min-height:230px}.country{font-size:13px;color:#555}.card h2{font-family:Amiri,serif;margin:12px 0 5px;font-size:25px}.field{font-size:13px}.card p{color:#666;line-height:1.6;flex:1}.card a{color:#111;font-weight:700}.empty{grid-column:1/-1;text-align:center;padding:32px;border:1px dashed #aaa;color:#666}footer{text-align:center;color:#777;border-top:1px solid #ddd;padding:22px}@media(max-width:720px){.hero{grid-template-columns:1fr}.mark{width:170px;height:170px}.tools{grid-template-columns:1fr}main{padding-top:42px}}
</style></head>
<body><header><nav class="nav"><a class="brand" href="#"><div class="brand-ar">مِسبار</div><div class="brand-en">MISBAR</div></a><button id="lang" class="lang" type="button">English</button></nav></header>
<main><section class="hero"><div><h1 id="title">اكتشف فرصتك القادمة</h1><p id="subtitle">منصة تجمع الهاكاثونات والمسابقات التقنية في جميع الدول العربية — في مكان واحد.</p></div><div class="mark" aria-label="Misbār logo"><div><strong>مِسبار</strong><small>MISBAR</small></div></div></section>
<section class="tools"><input id="search" type="search" placeholder="ابحث عن هاكاثون أو مجال…" aria-label="بحث"><select id="country" aria-label="الدولة"><option value="">كل الدول العربية</option></select></section><div id="count" class="count"></div><section id="cards" class="grid" aria-live="polite"></section></main><footer>Misbār · Discover. Build. Compete.</footer>
<script>
const countries=['السعودية','الإمارات','الأردن','البحرين','قطر','الكويت','عُمان','اليمن','العراق','سوريا','لبنان','فلسطين','مصر','السودان','ليبيا','تونس','الجزائر','المغرب','موريتانيا','الصومال','جيبوتي','جزر القمر'];
const items=[
{title:'هاكاثون المدن الذكية',en:'Smart Cities Hackathon',country:'السعودية',field:'ذكاء اصطناعي',date:'2026-12-10',description:'حلول تقنية لتحسين جودة الحياة والخدمات الحضرية.'},
{title:'تحدي التقنية المالية',en:'FinTech Challenge',country:'الإمارات',field:'FinTech',date:'2026-11-28',description:'ابنِ منتجًا ماليًا آمنًا يخدم المنطقة.'},
{title:'هاكاثون التعليم المفتوح',en:'Open Education Hackathon',country:'الأردن',field:'EdTech',date:'2027-01-15',description:'أفكار تعليمية رقمية قابلة للتوسع.'},
{title:'ابتكر للمستقبل',en:'Innovate for Tomorrow',country:'مصر',field:'استدامة',date:'2026-12-22',description:'مشاريع تقنية للبيئة والطاقة والمجتمع.'},
{title:'تحدي البيانات الرياضية',en:'Sports Data Challenge',country:'قطر',field:'بيانات',date:'2027-02-01',description:'استخدم البيانات لبناء تجارب رياضية أفضل.'}];
countries.forEach(function(c){var o=document.createElement('option');o.textContent=c;document.querySelector('#country').appendChild(o)});
var english=false,date=new Intl.DateTimeFormat('ar-SA',{dateStyle:'medium'});
function render(){var q=document.querySelector('#search').value.trim().toLowerCase(),c=document.querySelector('#country').value;var results=items.filter(function(x){return(!c||x.country===c)&&(!q||[x.title,x.en,x.field,x.description].join(' ').toLowerCase().includes(q))});document.querySelector('#count').textContent=english?results.length+' of '+items.length+' opportunities':'عرض '+results.length+' من '+items.length+' فرص';document.querySelector('#cards').innerHTML=results.length?results.map(function(x){return '<article class="card"><div class="country">'+x.country+'</div><h2>'+(english?x.en:x.title)+'</h2><div class="field">'+x.field+'</div><p>'+x.description+'</p><div><span>'+date.format(new Date(x.date+'T00:00:00'))+'</span> · <a href="https://www.google.com/search?q='+encodeURIComponent(x.en)+'" target="_blank" rel="noreferrer">'+(english?'Find details':'ابحث عن التفاصيل')+' ←</a></div></article>'}).join(''):'<div class="empty">لا توجد نتائج مطابقة.</div>'}
document.querySelector('#search').addEventListener('input',render);document.querySelector('#country').addEventListener('change',render);document.querySelector('#lang').addEventListener('click',function(){english=!english;document.documentElement.lang=english?'en':'ar';document.documentElement.dir=english?'ltr':'rtl';document.querySelector('#title').textContent=english?'Discover your next opportunity':'اكتشف فرصتك القادمة';document.querySelector('#subtitle').textContent=english?'Hackathons and tech competitions across the Arab world — in one place.':'منصة تجمع الهاكاثونات والمسابقات التقنية في جميع الدول العربية — في مكان واحد.';document.querySelector('#lang').textContent=english?'العربية':'English';render()});render();
</script></body></html>
